    <style>
        /* Wallpaper — purple gradient for the game (visible behind modal too, but modal covers it) */
        html, body {
            background: linear-gradient(135deg, #6a2cb8 0%, #2a0e6e 100%) !important;
            min-height: 100vh;
            min-height: 100dvh;
        }
        /* Push game + final-screen content to the top instead of vertically centering — eliminates the huge gap above the headline. Also use dvh height so iOS Safari toolbar doesn't cover the progress bar. */
        .game, .game-final-screen {
            justify-content: flex-start !important;
            gap: 3vh !important;
            padding-top: 3vh !important;
            padding-bottom: calc(7rem + env(safe-area-inset-bottom)) !important;
            height: 100dvh !important;
        }
        /* Lift the footer (progress bar / claim button) above iOS Safari's bottom toolbar */
        .game__footer {
            bottom: calc(2.8rem + env(safe-area-inset-bottom)) !important;
        }
        /* Override constructor's .background section that has its own teal gradient */
        .background {
            background: linear-gradient(135deg, #6a2cb8 0%, #2a0e6e 100%) !important;
            background-image: linear-gradient(135deg, #6a2cb8 0%, #2a0e6e 100%) !important;
        }
        /* Hide clouds + sky — keep apple logo stars visible (icons brought back) */
        .background__cloud, .background__sky { display: none !important; }
        /* Modal — same purple gradient as the game wallpaper, content pushed up from top */
        .modal {
            background: linear-gradient(135deg, #6a2cb8 0%, #2a0e6e 100%) !important;
            align-items: flex-start !important;
            padding-top: 4vh !important;
        }
        /* Chunky game header font — Lilita One, uppercase, dual-color */
        .game__header__h1 {
            font-family: 'Oswald', sans-serif !important;
            font-size: clamp(2.4rem, 10.5vw, 4rem) !important;
            font-weight: 800 !important;
            line-height: 0.95 !important;
            letter-spacing: 0.01em !important;
            text-transform: uppercase !important;
            text-shadow: 0 4px 14px rgba(0,0,0,0.45);
            margin: 0 !important;
        }
        .game__header__h1 .l1 { color: #ffd54a !important; }
        .game__header__h1 .l2 { color: #ffffff !important; }
        .game__header__h3 {
            font-family: 'Oswald', sans-serif !important;
            font-size: clamp(1.1rem, 5vw, 1.55rem) !important;
            font-weight: 700 !important;
            letter-spacing: 0.05em !important;
            text-transform: uppercase !important;
            color: #fff8d6 !important;
            margin-top: 1.2rem !important;
            text-shadow: 0 2px 8px rgba(0,0,0,0.35);
            transition: color 0.15s;
        }
        /* Golden glow halo around the gift box — uses a pseudo-element with opacity pulse
           (much cheaper for mobile GPUs than animating filter: drop-shadow). */
        .game .game__main { position: relative; isolation: isolate; }
        .game .game__main::before {
            content: '';
            position: absolute;
            inset: -15%;
            background: radial-gradient(circle, rgba(255, 213, 74, 0.45) 0%, rgba(255, 213, 74, 0) 65%);
            pointer-events: none;
            z-index: -1;
            animation: glow-pulse 2.4s ease-in-out infinite;
            will-change: opacity;
        }
        @keyframes glow-pulse {
            0%, 100% { opacity: 0.75; }
            50% { opacity: 1; }
        }
        .game .game__main__image {
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.45));
        }
        /* Re-style bonus value popups to match the theme (gold + dark stroke for readability on purple).
           Cleanup of accumulating popups is handled by inline JS that removes them after fadeOut completes. */
        .game__main__bonus-value {
            color: #ffd54a !important;
            font-family: 'Oswald', sans-serif !important;
            font-weight: 800 !important;
            font-size: clamp(1.6rem, 6vw, 2.4rem) !important;
            text-shadow: 0 0 6px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.5);
        }
        /* Urgent flash — applied via inline script when countdown <= 3 seconds */
        .game__header__h3.urgent,
        .game__progress__value.urgent {
            animation: flash-red 0.5s ease-in-out infinite alternate !important;
        }
        @keyframes flash-red {
            from { color: #fff8d6; transform: scale(1); }
            to { color: #ff3838; transform: scale(1.08); }
        }
        /* Final screen — override constructor's yellow gradient with same purple */
        .game-final-screen {
            background: linear-gradient(135deg, #6a2cb8 0%, #2a0e6e 100%) !important;
            background-image: linear-gradient(135deg, #6a2cb8 0%, #2a0e6e 100%) !important;
        }
        .game-final-screen .game__header__h1 {
            font-family: 'Oswald', sans-serif !important;
            font-size: clamp(2.2rem, 9.5vw, 3.6rem) !important;
            font-weight: 800 !important;
            text-transform: uppercase !important;
            color: #ffd54a !important;
            text-shadow: 0 4px 14px rgba(0,0,0,0.45);
            margin: 0 0 0.5rem !important;
            line-height: 1 !important;
        }
        .game-final-screen .game__header__text {
            font-family: 'Oswald', sans-serif !important;
            font-size: clamp(1.5rem, 7vw, 2.2rem) !important;
            font-weight: 700 !important;
            color: #ffffff !important;
            text-transform: none !important;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            margin: 0.5rem 0 1.5rem !important;
        }
        /* Subline below "You've won..." — visible, styled to match theme */
        .game-final-screen .game__header__h3 {
            display: block !important;
            font-family: 'Oswald', sans-serif !important;
            font-size: clamp(1.2rem, 5.5vw, 1.7rem) !important;
            font-weight: 700 !important;
            color: #fff8d6 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.04em !important;
            margin: 0.5rem 0 1rem !important;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        /* Center the iPhone image within .game__main on final screen */
        .game-final-screen .game__main {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 100% !important;
        }
        /* Override constructor's scale(1.45) on final image — too big, covers heading */
        .game-final-screen .game__main__image {
            transform: none !important;
            max-width: 55% !important;
            max-height: 38vh !important;
            object-fit: contain;
            filter: drop-shadow(0 12px 24px rgba(0,0,0,0.5));
            margin: 0 auto;
        }
        /* Down arrow that bobs to point at the claim button */
        .final-arrow {
            display: block;
            text-align: center;
            font-size: clamp(2.8rem, 11vw, 4.2rem);
            line-height: 1;
            color: #ffd54a;
            margin-top: 1rem;
            text-shadow: 0 4px 12px rgba(0,0,0,0.45);
            animation: arrow-bob 1s ease-in-out infinite;
        }
        @keyframes arrow-bob {
            0%, 100% { transform: translateY(0); opacity: 0.85; }
            50% { transform: translateY(12px); opacity: 1; }
        }
        /* Style the claim button like the modal start button (chunky yellow with white border) */
        .game-final-screen .game__button {
            background: linear-gradient(180deg, #ffe27a 0%, #ffbd2e 100%) !important;
            background-color: transparent !important;
            color: #5c2a00 !important;
            border: 3px solid #ffffff !important;
            border-radius: 999px !important;
            padding: 1.4rem 2rem !important;
            font-family: 'Oswald', sans-serif !important;
            font-size: clamp(1.3rem, 5.5vw, 1.7rem) !important;
            font-weight: 800 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.04em !important;
            box-shadow: 0 10px 0 #d18a00, 0 16px 30px rgba(0,0,0,0.18) !important;
            animation: btn-wiggle 1.6s ease-in-out infinite;
            transform-origin: center;
        }
        .modal__window {
            background: transparent !important;
            box-shadow: none !important;
            padding: 0 2rem !important;
            max-width: 92vw;
            text-align: center;
            color: #fff;
        }
        .modal__window__image {
            display: block !important;
            max-width: 48%;
            max-height: 30vh;
            margin: 0 auto 1rem;
            filter: drop-shadow(0 10px 22px rgba(0,0,0,0.4));
        }
        .modal__celebrate {
            display: block;
            font-size: clamp(4.5rem, 22vw, 7.5rem);
            line-height: 1;
            margin: 0 auto 1.5rem;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.25));
        }
        .modal__window__title {
            font-size: clamp(2rem, 8.5vw, 2.9rem) !important;
            font-weight: 900 !important;
            color: #fff !important;
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            margin: 0 0 1rem !important;
            letter-spacing: -0.01em;
            line-height: 1.05;
        }
        .modal__window__text {
            font-size: clamp(1.2rem, 5.5vw, 1.65rem) !important;
            color: #fff8d6 !important;
            font-weight: 700 !important;
            margin: 0 0 2rem !important;

    <!-- Urgent countdown — parallel observer, watches the constructor's seconds value and adds .urgent class when <= 3 -->
    <script>
        (function () {
            'use strict';
            document.addEventListener('DOMContentLoaded', function () {
                var valueEl = document.querySelector('.game__progress__value');
                var headerEl = document.querySelector('.game__progress__value-header');
                if (!valueEl) return;
                var apply = function () {
                    var n = parseInt((valueEl.textContent || '').trim(), 10);
                    var urgent = !isNaN(n) && n <= 3 && n > 0;
                    [valueEl, headerEl].forEach(function (el) {
                        if (!el) return;
                        if (urgent) el.classList.add('urgent');
                        else el.classList.remove('urgent');
                    });
                };
                var observer = new MutationObserver(apply);
                observer.observe(valueEl, { childList: true, characterData: true, subtree: true });
                apply();
            });
        })();
    </script>

    <!-- Bonus-value cleanup — removes constructor's +N popups from DOM after their 3s fadeOut completes.
         Prevents the DOM accumulation that crashes iOS Safari on rapid tapping. -->
    <script>
        (function () {
            'use strict';
            document.addEventListener('DOMContentLoaded', function () {
                var container = document.querySelector('.game__main__bonus-container');
                if (!container) return;
                var observer = new MutationObserver(function (mutations) {
                    mutations.forEach(function (m) {
                        m.addedNodes.forEach(function (node) {
                            if (node.nodeType !== 1) return;
                            // fadeOut animation is 3s; remove shortly after
                            setTimeout(function () {
                                if (node && node.parentNode) node.parentNode.removeChild(node);
                            }, 3500);
                        });
                    });
                });
                observer.observe(container, { childList: true });
            });
        })();
    </script>
